name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'graphify-out/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'graphify-out/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: vpk-11/workflows/.github/workflows/node-ci.yml@v1
    with:
      pm: 'npm'
      command: >-
        GANACHE_URL=http://127.0.0.1:8545
        GANACHE_ACC_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111
        npx hardhat compile
        && cd client && npm ci && npm run build
